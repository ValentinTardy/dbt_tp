version: 2

sources:
  - name: bronze
    schema: bronze
    description: "Tables sources de la couche Bronze"
    tables:
      - name: customers
        description: "Informations sur les clients"
        columns:
          - name: customerid
            tests:
              - unique
              - not_null

      - name: orders
        description: "Commandes"
        columns:
          - name: orderid
            tests:
              - unique
              - not_null
          - name: status
            tests:
              - accepted_values:
                  values: ['01', '02', '03']
          - name: customerid
            tests:
              - relationships:
                  to: source('bronze', 'customers')
                  field: customerid

      - name: orderitems
        description: "Détail des lignes de commande"
        columns:
          - name: orderid
            tests:
              - not_null
              - relationships:
                  to: source('bronze', 'orders')
                  field: orderid

      - name: dates
        description: "Référentiel des dates"
      - name: employees
        description: "Informations sur les employés"
      - name: products
        description: "Produits"
      - name: stores
        description: "Magasins"
      - name: suppliers
        description: "Fournisseurs"

  - name: training
    schema: training
    description: "Données de ventes par pays (training.sql)"
    tables:
      - name: sales_india
      - name: sales_uk
      - name: sales_us